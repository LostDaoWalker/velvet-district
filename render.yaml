services:
  - type: web
    name: velvet-district
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velvet-district-db
          property: connectionString

databases:
  - name: velvet-district-db
    plan: starter
