<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Velvet District</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <img src="assets/hero-painterly.png" alt="Painterly fashion crew in a neon boutique district">
        <div class="hero-copy">
          <p class="kicker">Baddie Gacha PBBG</p>
          <h1>Velvet District</h1>
          <p id="rank">Rookie</p>
        </div>
      </section>

      <section class="status" aria-label="Player resources">
        <div><span>Coins</span><strong id="coins">0</strong></div>
        <div><span>Energy</span><strong id="energy">0</strong></div>
        <div><span>Power</span><strong id="power">0</strong></div>
      </section>

      <nav class="tabs" aria-label="Game sections">
        <button class="tab active" data-view="play">Play</button>
        <button class="tab" data-view="collection">Collection</button>
        <button class="tab" data-view="goals">Goals</button>
      </nav>

      <section class="view active" data-panel="play">
        <article class="panel focus-panel">
          <div class="panel-head">
            <div>
              <h2>District Run</h2>
              <p>Pick one job, then pull style relics with the coins.</p>
            </div>
            <button id="dailyBtn" class="ghost">Daily glam</button>
          </div>
          <div id="districts" class="districts"></div>
        </article>

        <article class="panel gacha-panel">
          <div class="panel-head">
            <div>
              <h2>Gacha</h2>
              <p id="pity">Pity 0/10</p>
            </div>
            <span id="gems">0 gems</span>
          </div>
          <img class="relic-art" src="assets/relics-painterly.png" alt="Painterly fashion relics">
          <div class="button-row">
            <button id="pullBtn" class="primary">Pull</button>
            <button id="tenPullBtn" class="primary alt">Ten pull</button>
          </div>
        </article>
      </section>

      <section class="view" data-panel="collection">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Closet</h2>
              <p id="collectionCount">0/0 relics</p>
            </div>
          </div>
          <div id="closet" class="closet"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Sets</h2>
              <p id="setCount">0/0 active</p>
            </div>
          </div>
          <div id="sets" class="stack"></div>
        </article>
      </section>

      <section class="view" data-panel="goals">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Errands</h2>
              <p id="errandCount">0/0 complete</p>
            </div>
          </div>
          <div id="errands" class="stack"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>Crew</h2>
              <p>Quiet bonuses, always on.</p>
            </div>
            <button id="resetBtn" class="ghost">Reset</button>
          </div>
          <div id="crew" class="crew"></div>
        </article>
      </section>

      <section class="toast" aria-live="polite">
        <div id="lastPull">Loading Velvet District...</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
